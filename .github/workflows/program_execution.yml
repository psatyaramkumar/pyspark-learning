name: Program Execution Workflow
run-name: Program Execution ${{ github.event.inputs.program }}
on:
    workflow_dispatch:
        inputs:
            program:
                description: 'Program to execute'
                required: true
                default: 'main.py'
                type: string
jobs:
    execute_program:
        runs-on: ubuntu-latest
        steps:
            - name: check pyspark and java isntalled / not
              id: check_libs
              run: |
                if command -v pyspark >/dev/null 2>&1; then
                    echo "pyspark is installed"
                    echo "pyspark_installed=true" >> $GITHUB_OUTPUT
                else
                    echo "pyspark is not installed"
                    echo "pyspark_installed=false" >> $GITHUB_OUTPUT
                fi
                if command -v java >/dev/null 2>&1; then
                    echo "java is installed"
                    echo "java_installed=true" >> $GITHUB_OUTPUT
                else
                    echo "java is not installed"
                    echo "java_installed=false" >> $GITHUB_OUTPUT
                fi
                
            - name: Install Java if not Installed
              if: steps.check_libs.outputs.java_installed == 'false'
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  version: "17"
            - name: Install Python if not installed
              if: steps.check_libs.outputs.pyspark_installed == 'false'
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  
            - name: Install Pyspark
              run: |
                python3 -m pip install --upgrade pip
                python3 -m pip install pyspark
            - name: Checkout Git Repository
              uses: actions/checkout@v3

            
            - name: Execute the PySpark Program
              run: |
                mkdir -p output
                python3 ${{ github.event.inputs.program }} 2>&1 | tee output/result.txt
            - name: Display the Output
              if: always()
              shell: bash
              run: |
                echo "Program Output:" >> $GITHUB_STEP_SUMMARY
                echo "--------------------" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                cat output/result.txt >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
                echo "#Completed" >> $GITHUB_STEP_SUMMARY
            - name: Store Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: program-output
                  path: output/
                  retention-days: 5

            
                  

            
                